name: Build Hermes code-server image

on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - Dockerfile.slim
      - .dockerignore
      - setup_slim.sh
      - verify_slim.sh
      - devcontainer-start
      - code-server-font-proxy/**
      - Taskfile.yml
      - .github/workflows/build-hermes-code.yml
  workflow_dispatch:

concurrency:
  group: build-hermes-code
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-hermes-code-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve official Hermes revision
        id: meta
        shell: bash
        run: |
          upstream_sha="$(git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main | awk '{print $1}')"
          test -n "$upstream_sha"
          short_sha="${upstream_sha::12}"
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          echo "version_tag=hermes-code-${stamp}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "marker_tag=hermes-code-upstream-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
      - name: Check for an existing upstream build
        id: existing
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && \
             docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.marker_tag }}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push Hermes code-server image
        if: steps.existing.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.slim
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:hermes-code
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.marker_tag }}
          build-args: |
            HERMES_SOURCE_REV=${{ steps.meta.outputs.upstream_sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:hermes-code
          cache-to: type=inline
          provenance: false
          sbom: false
      - name: Verify pushed tag exists
        if: steps.existing.outputs.build == 'true'
        run: |
          docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.version_tag }}"
